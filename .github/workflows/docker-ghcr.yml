name: Build and push Docker images (GHCR)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]   # optional: push a v1.0.0 tag to publish a versioned image
  pull_request:   # every PR (any base branch): runs lint + test only; build/deploy are skipped
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (no --fix; any error or warning fails)
        run: npm run lint:check

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: theindex
          POSTGRES_PASSWORD: theindex
          POSTGRES_DB: theindex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U theindex -d theindex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI-only values for the Postgres service above; not secrets.
      # Integration tests (test:int) use TEST_DB_*; e2e boots AppModule, which reads DB_*.
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 5432
      TEST_DB_USER: theindex
      TEST_DB_PASS: theindex
      TEST_DB_NAME: theindex_test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: theindex
      DB_PASS: theindex
      DB_NAME: theindex_test
      DB_SYNC: "true"
      JWT_SECRET: ci-only-not-a-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Integration tests (Postgres)
        run: npm run test:int

      - name: e2e tests (Postgres)
        run: npm run test:e2e

  build-api:
    needs: [lint, test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/theindex-api
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push (API)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    # Listed explicitly so a red lint/test job always blocks the deploy.
    needs: [lint, test, build-api]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/theindex
            docker compose pull
            docker compose up -d
